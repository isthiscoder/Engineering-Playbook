<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="home" href="{{ site.home_url }}">Home</a>
    <form class="search" action="{{ '/' | relative_url }}" method="get" role="search">
      <input id="q" name="q" type="search" placeholder="Search titles, tags, dates" aria-label="Search posts" autocomplete="off">
    </form>
    <a class="title" href="{{ '/' | relative_url }}">Engineering Playbook</a>
  </div>

  {{ content }}
</div>

<script>
  // Live search on the list page. On a post page, pressing Enter opens the list with that search.
  (function () {
    var q = document.getElementById("q"), list = document.getElementById("list");
    if (!list) return;
    var rows = list.querySelectorAll("li");
    var none = document.getElementById("none");
    var param = new URLSearchParams(location.search).get("q");
    function run() {
      var f = q.value.trim().toLowerCase(), shown = 0;
      rows.forEach(function (r) {
        var ok = !f || r.getAttribute("data-s").indexOf(f) !== -1;
        r.hidden = !ok; if (ok) shown++;
      });
      if (none) none.hidden = shown !== 0;
    }
    q.addEventListener("input", run);
    q.form.addEventListener("submit", function (e) { e.preventDefault(); });
    if (param) q.value = param;
    run();
  })();
</script>
</body>
</html>
